name: Petclinic CI-CD Angular Backend

on: 
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: petclinic-rest

jobs:

  # Stage 1: Compile & Run Unit / Integration Tests
  build-test-validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven

    - name: Run Maven tests
      run: ./mvnw clean test

# Stage 2: Build Image via Multi-Stage Dockerfile & Sync GitOps
  build-push-update:
    name: Build, Push and Update GitOps repo
    needs: build-test-validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source code
      uses: actions/checkout@v5

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v6.3.0
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        build-args: |
          IMAGE_TAG=${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate Github app token
      uses: actions/create-github-app-token@v3
      id: github-app-token
      with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repository: aws-eks-gitops

    - name: Checkout GitOps repo
      uses: actions/checkout@v6
      with:
        repository: srshyam/aws-eks-gitops
        token: ${{ steps.github-app-token.outputs.token }}
        ref: petclinic-eks-helm-autoscaling
        
    - name: Update Helm Image Tag in GitOps Repo
      run: |
        cd gitops-repo
        
        # 1. Update ONLY the rest values file
        yq e '.rest.image.tag = "${{ github.sha }}"' -i environments/dev/values-rest.yaml
        
        # 2. Configure Git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add environments/dev/values-rest.yaml
        
        # 3. Commit, Rebase, and Push
        if ! git diff-index --quiet HEAD --; then
          git commit -m "Auto-update rest image tag to ${{ github.sha }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD
        else
          echo "No change in image tag."
        fi